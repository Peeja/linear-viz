<!DOCTYPE html>
<html lang="en">
<head>

<title>Linear Dependency Graph</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#ffffff; --bg2:#f5f5f3; --bg3:#ebebea;
  --text:#1a1a19; --text2:#6b6b67; --text3:#9c9a92;
  --border:rgba(0,0,0,0.12); --border2:rgba(0,0,0,0.22);
  --radius:8px; --font:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",monospace;
  --c-done:#1D9E75; --c-progress:#378ADD; --c-review:#8E76E5; --c-todo:#888780;
  --c-cancelled:#D85A30; --c-block:#E24B4A;
}
@media (prefers-color-scheme:dark) {
  :root { --bg:#1c1c1b; --bg2:#252524; --bg3:#2e2e2c;
    --text:#e8e6df; --text2:#9c9a92; --text3:#6b6b67;
    --border:rgba(255,255,255,0.1); --border2:rgba(255,255,255,0.22); }
}
body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
header { padding:14px 18px 12px; border-bottom:0.5px solid var(--border); background:var(--bg); flex-shrink:0; }
h1 { font-size:14px; font-weight:500; margin-bottom:10px; color:var(--text2); }
.controls { display:flex; flex-direction:column; gap:7px; }
.row { display:flex; gap:7px; align-items:center; }
input[type="password"],input[type="text"] {
  height:30px; padding:0 9px; border:0.5px solid var(--border2);
  border-radius:var(--radius); background:var(--bg2); color:var(--text);
  font-size:12px; outline:none; transition:box-shadow 0.15s;
}
input[type="password"] { font-family:var(--mono); flex:1; }
input.ii { width:148px; }
input.fi { flex:1; }
input:focus { box-shadow:0 0 0 2px rgba(55,138,221,0.2); }
button {
  height:30px; padding:0 12px; font-size:12px; font-weight:500;
  font-family:var(--font); background:var(--bg2); border:0.5px solid var(--border2);
  border-radius:var(--radius); color:var(--text); cursor:pointer; white-space:nowrap; transition:background 0.12s;
}
button:hover { background:var(--bg3); }
button:active { transform:scale(0.98); }
button:disabled { opacity:0.4; cursor:default; transform:none; }
.kh { font-size:10px; color:var(--text3); }
.kh a { color:var(--text3); }
.sb {
  padding:6px 18px; font-size:11px; color:var(--text2);
  border-bottom:0.5px solid var(--border); min-height:30px;
  display:flex; align-items:center; gap:12px; background:var(--bg); flex-shrink:0;
}
.sb.err { color:var(--c-block); }
.legend { display:flex; gap:12px; font-size:11px; color:var(--text2); flex-wrap:wrap; margin-left:auto; }
.li { display:flex; align-items:center; gap:4px; }
.dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
#gw { flex:1; position:relative; overflow-y:auto; overflow-x:auto; background:var(--bg2); min-height:0; }
#gw svg { display:block; }
.es {
  position:absolute; inset:0; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:8px;
  color:var(--text3); font-size:13px; pointer-events:none;
}

  position:absolute; pointer-events:none; background:var(--bg);
  border:0.5px solid var(--border2); border-radius:var(--radius);
  padding:8px 12px; font-size:11px; color:var(--text);
  max-width:240px; display:none; z-index:100; line-height:1.6;
  box-shadow:0 4px 16px rgba(0,0,0,0.12);
}

</head>
<body>
<header>
  <h1>Linear · dependency graph</h1>
  <div class="controls">
    <div class="row">
      <input type="text" id="pi" class="ii" placeholder="Parent ID  e.g. FIL-273" spellcheck="false"/>
      <button id="lb">Load</button>
      <input type="text" id="fi" class="fi" placeholder="Filter by identifier or title…"/>
      <button id="zf">Top</button>
    </div>
    <div class="kh">API key loaded server-side from config.json — never sent to the browser.</div>
  </div>
</header>
<div class="sb" id="sb">
  <span id="st">Enter a parent issue ID (e.g. FIL-273) and click Load.</span>
  <div class="legend" id="legend" style="display:none">
    <div class="li"><div class="dot" style="background:var(--c-done)"></div>Done</div>
    <div class="li"><div class="dot" style="background:var(--c-progress)"></div>In progress</div>
    <div class="li"><div class="dot" style="background:var(--c-review)"></div>In review</div>
    <div class="li"><div class="dot" style="background:var(--c-todo)"></div>Todo/backlog</div>
    <div class="li"><div class="dot" style="background:var(--c-cancelled)"></div>Cancelled</div>
    <div class="li" style="margin-left:4px"><svg width="17" height="11"><rect x="1" y="1" width="15" height="9" rx="2" fill="none" stroke="var(--text2)" stroke-width="2"/></svg>Unblocked</div>
    <div class="li"><svg width="17" height="11"><rect x="1" y="1" width="15" height="9" rx="2" fill="none" stroke="var(--text2)" stroke-width="1.3" stroke-dasharray="3 2"/></svg>Review-blocked</div>
    <div class="li"><svg width="17" height="11"><rect x="1" y="1" width="15" height="9" rx="2" fill="none" stroke="var(--text2)" stroke-opacity="0.35"/></svg>Blocked</div>
    <div class="li" style="margin-left:4px">
      <svg width="22" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="var(--c-block)" stroke-width="1.5"/></svg>Blocks
    </div>
    <div class="li">
      <svg width="22" height="10"><line x1="0" y1="5" x2="22" y2="5" stroke="var(--c-todo)" stroke-width="1" stroke-dasharray="3 2"/></svg>Related
    </div>
  </div>
</div>
<div id="gw">
  <div class="es" id="es"><span style="font-size:28px;opacity:0.25">⬡</span><span>No issues loaded</span></div>
  <svg id="svg"></svg>
  <div id="tt"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
const GQL = '/api/graphql';  // local proxy; key is injected server-side
const NW = 172, NH = 44, HGAP = 40, VGAP = 88, R = 6;
let allNodes=[], allLinks=[], svgSel, gSel;
let WORKSPACE = 'filecoin-foundation';  // overwritten from /api/meta

const isDummy = id => typeof id === 'string' && id.startsWith('__d_');

// Workflow-state predicates (shared by colouring and readiness). "In Review" is
// a started-type state distinguished by name (gated so a completed "Reviewed"
// state isn't mistaken for it).
function isReview(type, name){ return (type||'').toLowerCase()==='started' && !!name && /review/i.test(name); }
function isDone(type){ return (type||'').toLowerCase()==='completed'; }
function isCancelled(type){ const s=(type||'').toLowerCase(); return s==='canceled'||s==='cancelled'; }

function stateColor(t, name) {
  if (isReview(t, name)) return '#8E76E5';
  const s = (t||'').toLowerCase();
  if (s==='completed') return '#1D9E75';
  if (s==='started')   return '#378ADD';
  if (s==='canceled'||s==='cancelled') return '#D85A30';
  return '#888780';
}

function setStatus(m, err=false) {
  document.getElementById('st').textContent = m;
  document.getElementById('sb').className = 'sb'+(err?' err':'');
}

// ── Linear API ───────────────────────────────────────────────────────────────
async function gqlQ(query, vars={}) {
  const r = await fetch(GQL, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({query, variables:vars})
  });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  if (j.errors?.length) throw new Error(j.errors[0].message);
  return j.data;
}
const USER = `assignee{name displayName avatarUrl}`;
const FRAG = `id identifier title state{type name} ${USER}
  relations(first:50){nodes{type relatedIssue{id identifier title state{type name} ${USER}}}}`;
async function loadIssues(pid) {
  // issue(id:) accepts both the human identifier (e.g. "FIL-273") and the UUID
  const pd = await gqlQ(`query($id:String!){issue(id:$id){${FRAG} children(first:250){nodes{${FRAG}}}}}`,{id:pid});
  const par = pd.issue;
  if (!par) throw new Error(`Issue "${pid}" not found.`);
  // children(first:) is available directly on the parent — use it instead of a filter query
  const ch = par.children?.nodes || [];
  return [par, ...ch.filter(c=>c.id!==par.id)];
}

// ── Graph build ──────────────────────────────────────────────────────────────
function buildGraph(issues) {
  const nm = new Map();
  issues.forEach(i => nm.set(i.id, {id:i.id,identifier:i.identifier,title:i.title,
    stateType:i.state?.type, stateName:i.state?.name, assignee:i.assignee||null, external:false}));
  const links=[], seen=new Set();
  issues.forEach(iss => {
    (iss.relations?.nodes||[]).forEach(rel => {
      const ri = rel.relatedIssue; if (!ri) return;
      // Skip blocked_by — it's the mirror of blocks from the other side
      if (rel.type==='blocked_by') return;
      if (!nm.has(ri.id)) nm.set(ri.id,{id:ri.id,identifier:ri.identifier,title:ri.title,
        stateType:ri.state?.type, stateName:ri.state?.name, assignee:ri.assignee||null, external:true});
      const key=`${iss.id}|${ri.id}|${rel.type}`;
      if (seen.has(key)) return; seen.add(key);
      links.push({source:iss.id, target:ri.id, type:rel.type});
    });
  });
  return {nodes:[...nm.values()], links};
}

// ── Sugiyama pipeline ────────────────────────────────────────────────────────

// 1. Longest-path layer assignment
function assignLayers(nodes, links) {
  const bl = links.filter(l=>l.type==='blocks');
  const inE = new Map(nodes.map(n=>[n.id,[]]));
  bl.forEach(l=>{ if(inE.has(l.target)) inE.get(l.target).push(l.source); });
  const rank=new Map(), vis=new Set();
  function dfs(id) {
    if (vis.has(id)) return rank.get(id)??0;
    vis.add(id);
    const preds=inE.get(id)||[];
    const r = preds.length===0 ? 0 : Math.max(...preds.map(p=>dfs(p)))+1;
    rank.set(id,r); return r;
  }
  nodes.forEach(n=>dfs(n.id));
  nodes.forEach(n=>{ if(!rank.has(n.id)) rank.set(n.id,0); });
  return rank;
}

// 1b. Pull-down compaction. Longest-path puts every node as early as possible,
// stranding nodes far above their only successor with long dangling edges.
// Pull each non-sink node down to just above its earliest successor, as long
// as that doesn't violate a predecessor (rank must stay > all preds). Iterate
// to a fixed point. Not NP-hard — a few linear passes; shortens edges and
// compacts the drawing.
function compactLayers(nodes, links, rank) {
  const bl=links.filter(l=>l.type==='blocks');
  const succ=new Map(nodes.map(n=>[n.id,[]]));
  const pred=new Map(nodes.map(n=>[n.id,[]]));
  bl.forEach(l=>{ if(succ.has(l.source)) succ.get(l.source).push(l.target);
                  if(pred.has(l.target)) pred.get(l.target).push(l.source); });
  let changed=true, guard=0;
  while(changed && guard++<nodes.length+4){
    changed=false;
    nodes.forEach(n=>{
      const ss=succ.get(n.id)||[], ps=pred.get(n.id)||[];
      if(!ss.length) return;                       // sinks stay put
      const minSucc=Math.min(...ss.map(s=>rank.get(s)));
      const maxPred=ps.length?Math.max(...ps.map(p=>rank.get(p))):-Infinity;
      const target=minSucc-1;                       // sit one above earliest successor
      if(target>rank.get(n.id) && target>maxPred){ rank.set(n.id,target); changed=true; }
    });
  }
  return rank;
}


// 2. Dummy node insertion for edges spanning >1 layer. Each augmented link is
// tagged `bb` (is it part of a backbone edge?) so the dummy chain of a backbone
// edge stays alignable end-to-end.
function insertDummies(nodes, links, rank, backbone) {
  const isBB=l=> backbone ? backbone.has(l.source+'|'+l.target) : false;
  const augNodes=[...nodes], augLinks=[];
  let di=0;
  links.filter(l=>l.type==='blocks').forEach(l => {
    const bb=isBB(l);
    const rs=rank.get(l.source), rt=rank.get(l.target);
    if (rt-rs<=1) { augLinks.push({...l, bb}); return; }
    let prev=l.source;
    for (let r=rs+1; r<rt; r++) {
      const did=`__d_${di++}`;
      augNodes.push({id:did,dummy:true});
      rank.set(did,r);
      augLinks.push({source:prev,target:did,type:'blocks',bb,orig:{source:l.source,target:l.target}});
      prev=did;
    }
    augLinks.push({source:prev,target:l.target,type:'blocks',bb,orig:{source:l.source,target:l.target}});
  });
  links.filter(l=>l.type!=='blocks').forEach(l=>augLinks.push({...l}));
  return {augNodes,augLinks};
}

// 3. Build layer arrays
function buildLayers(augNodes, rank) {
  const layers=[];
  augNodes.forEach(n=>{
    const r=rank.get(n.id)??0;
    while(layers.length<=r) layers.push([]);
    layers[r].push(n.id);
  });
  return layers;
}

// 4. Crossing minimisation.
// Ordering one layer against a fixed neighbour is NP-hard in general, but at
// our sizes we can do much better than plain barycenter:
//   • median heuristic (Gansner et al.) — within 3× optimal, beats mean in practice
//   • count crossings each sweep and KEEP THE BEST ordering seen (not the last)
//   • brute-force the optimal ordering for small layers (≤ SMALL_LAYER)
const SMALL_LAYER=6;   // 6! = 720 perms per layer/sweep; above this use median
function minimizeCrossings(layers, augLinks) {
  const bl=augLinks.filter(l=>l.type==='blocks');
  const succs=new Map(), preds=new Map();
  layers.forEach(layer=>layer.forEach(id=>{ succs.set(id,[]); preds.set(id,[]); }));
  bl.forEach(l=>{
    if(succs.has(l.source)) succs.get(l.source).push(l.target);
    if(preds.has(l.target)) preds.get(l.target).push(l.source);
  });
  const posMap=layer=>{ const m=new Map(); layer.forEach((id,i)=>m.set(id,i)); return m; };

  // crossings between adjacent layers upper/lower, given lower's position map.
  // Standard accumulation: for each edge sort by (upperPos, lowerPos), count
  // inversions in the lowerPos sequence.
  function crossingsBetween(upper, lower, pm){
    const upPos=posMap(upper);
    const seq=[];
    upper.forEach(u=>{
      (succs.get(u)||[]).forEach(v=>{ if(pm.has(v)) seq.push([upPos.get(u), pm.get(v)]); });
    });
    seq.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    // count inversions in the second coordinate
    const ys=seq.map(s=>s[1]);
    let cross=0;
    for(let i=0;i<ys.length;i++) for(let j=i+1;j<ys.length;j++) if(ys[i]>ys[j]) cross++;
    return cross;
  }
  function totalCrossings(ls){
    let t=0;
    for(let i=0;i<ls.length-1;i++) t+=crossingsBetween(ls[i], ls[i+1], posMap(ls[i+1]));
    return t;
  }

  // median position of a node's fixed-layer neighbours (dot algorithm)
  function median(vals){
    if(!vals.length) return -1;
    vals.sort((a,b)=>a-b);
    const m=Math.floor(vals.length/2);
    if(vals.length%2===1) return vals[m];
    if(vals.length===2) return (vals[0]+vals[1])/2;
    const l=vals[m-1]-vals[0], r=vals[vals.length-1]-vals[m];
    return (l+r)===0 ? (vals[m-1]+vals[m])/2 : (vals[m-1]*r+vals[m]*l)/(l+r);
  }
  // reorder `layer` by median of neighbours; nodes with no fixed neighbour keep position
  function medianOrder(layer, neighborFn, pm){
    const withPos=layer.map((id,i)=>{
      const ns=neighborFn(id).map(n=>pm.get(n)).filter(p=>p!==undefined);
      return {id, i, m: median(ns)};
    });
    const fixed=withPos.filter(o=>o.m<0);          // keep where they are
    const movable=withPos.filter(o=>o.m>=0).sort((a,b)=>a.m-b.m || a.i-b.i);
    // merge: place movable in sorted order, leaving fixed at their original index
    const out=new Array(layer.length);
    fixed.forEach(o=>out[o.i]=o.id);
    let mi=0;
    for(let i=0;i<out.length;i++){ if(out[i]===undefined){ out[i]=movable[mi++].id; } }
    return out;
  }
  // optimal ordering of a small layer against a fixed neighbour, by brute force
  function permute(arr){
    if(arr.length<=1) return [arr];
    const res=[];
    arr.forEach((v,i)=>{ const rest=arr.slice(0,i).concat(arr.slice(i+1));
      permute(rest).forEach(p=>res.push([v,...p])); });
    return res;
  }
  function optimalOrder(layer, fixedLayer, isUpperFixed){
    // crossings of (fixedLayer, layer) or (layer, fixedLayer) for a candidate
    const best={order:layer, c:Infinity};
    const fixedPm=posMap(fixedLayer);
    permute(layer).forEach(cand=>{
      const c = isUpperFixed
        ? crossingsBetween(fixedLayer, cand, posMap(cand))
        : crossingsBetween(cand, fixedLayer, fixedPm);
      if(c<best.c){ best.c=c; best.order=cand; }
    });
    return best.order;
  }

  // crossings on layer r against only its neighbours (for local swap decisions)
  function localCross(ls, r){
    let c=0;
    if(r>0)            c+=crossingsBetween(ls[r-1], ls[r],   posMap(ls[r]));
    if(r<ls.length-1)  c+=crossingsBetween(ls[r],   ls[r+1], posMap(ls[r+1]));
    return c;
  }
  // Transposition refinement (Gansner et al.): repeatedly swap adjacent nodes in
  // a layer while the swap doesn't increase local crossings. Catches optima that
  // median/barycenter sweeps can't reach — the single biggest quality lever here.
  function transpose(ls){
    let improved=true, guard=0;
    while(improved && guard++<10){
      improved=false;
      for(let r=0;r<ls.length;r++){
        for(let i=0;i<ls[r].length-1;i++){
          const before=localCross(ls,r);
          [ls[r][i],ls[r][i+1]]=[ls[r][i+1],ls[r][i]];
          const after=localCross(ls,r);
          if(after<before) improved=true;
          else [ls[r][i],ls[r][i+1]]=[ls[r][i+1],ls[r][i]];   // revert
        }
      }
    }
  }

  let best=layers.map(l=>[...l]);
  let bestC=totalCrossings(best);
  let stale=0;                          // sweeps since last improvement
  for (let sw=0; sw<24 && bestC>0 && stale<4; sw++) {
    if (sw%2===0) {
      for (let i=1;i<layers.length;i++) {
        layers[i] = layers[i].length<=SMALL_LAYER
          ? optimalOrder(layers[i], layers[i-1], true)
          : medianOrder(layers[i], id=>preds.get(id)||[], posMap(layers[i-1]));
      }
    } else {
      for (let i=layers.length-2;i>=0;i--) {
        layers[i] = layers[i].length<=SMALL_LAYER
          ? optimalOrder(layers[i], layers[i+1], false)
          : medianOrder(layers[i], id=>succs.get(id)||[], posMap(layers[i+1]));
      }
    }
    transpose(layers);                  // local-swap refinement after each sweep
    const c=totalCrossings(layers);
    if(c<bestC){ bestC=c; best=layers.map(l=>[...l]); stale=0; } else { stale++; }
  }
  return best;
}

// 5. X-coordinate assignment — Brandes–Köpf style alignment.
// Naively centering each layer makes straight chains zig-zag. Instead we align
// each node with a median neighbour so long dependency chains draw as straight
// vertical lines and edge length shrinks. Linear-time, not NP-hard.
//
// Approach (a pragmatic single-direction BK):
//   1. Build vertical "alignment blocks": each node tries to align with the
//      median of its upper neighbours; conflicting alignments are dropped.
//   2. Assign each block one x (the column), then compact layers left-to-right
//      keeping ≥ (NW+HGAP) between neighbours in a layer and pulling blocks
//      toward their desired aligned x.
function assignCoords(layers, augLinks) {
  const SEP=NW+HGAP;
  const idLayer=new Map(), idIdx=new Map();
  layers.forEach((layer,ri)=>layer.forEach((id,ci)=>{ idLayer.set(id,ri); idIdx.set(id,ci); }));

  // ── Tidy-tree x-assignment over the backbone forest ──
  // Each node is centred over its backbone children; sibling subtrees occupy
  // disjoint horizontal ranges, so the layout reads like a clean tech tree with
  // zero backbone crossings. Sibling/root left-right order comes from the
  // crossing-minimised layer order, so secondary edges are arranged sensibly too.
  const bl=(augLinks||[]).filter(l=>l.type==='blocks');
  const bbParent=new Map(), bbKids=new Map(), dummyOrig=new Map();
  const seenBB=new Set();
  bl.forEach(l=>{
    if(l.orig){ if(isDummy(l.target)) dummyOrig.set(l.target,l.orig);
                if(isDummy(l.source)) dummyOrig.set(l.source,l.orig); }
    if(!l.bb) return;
    const s=l.orig?l.orig.source:l.source, t=l.orig?l.orig.target:l.target;  // collapse dummy chains
    const key=s+'|'+t; if(seenBB.has(key)) return; seenBB.add(key);
    bbParent.set(t,s);
    if(!bbKids.has(s)) bbKids.set(s,[]);
    bbKids.get(s).push(t);
  });
  bbKids.forEach(kids=>kids.sort((a,b)=>(idIdx.get(a)??0)-(idIdx.get(b)??0)));

  const realIds=layers.flat().filter(id=>!isDummy(id));
  const roots=realIds.filter(id=>!bbParent.has(id))
    .sort((a,b)=>(idLayer.get(a)-idLayer.get(b))||(idIdx.get(a)-idIdx.get(b)));

  // Contour-based packing (Walker's algorithm): lay out each subtree in a local
  // frame, then nestle sibling subtrees as close as their per-rank silhouettes
  // allow — a deep narrow branch tucks beside a shallow wide one — so the tree
  // stays compact instead of reserving a full column band per leaf. x = left edge.
  const x=new Map();
  const placed=new Set();
  function mergeInto(acc, c){                       // widen acc contour by c
    c.min.forEach((v,r)=>acc.min.set(r, acc.min.has(r)?Math.min(acc.min.get(r),v):v));
    c.max.forEach((v,r)=>acc.max.set(r, acc.max.has(r)?Math.max(acc.max.get(r),v):v));
  }
  function shiftSub(sub, d){                         // translate a whole subtree
    sub.nodes.forEach(n=>x.set(n, x.get(n)+d));
    const nmin=new Map(), nmax=new Map();
    sub.c.min.forEach((v,r)=>nmin.set(r,v+d));
    sub.c.max.forEach((v,r)=>nmax.set(r,v+d));
    sub.c={min:nmin,max:nmax};
  }
  // place a list of sibling subtrees left→right with min-SEP clearance per rank
  function packSiblings(subs){
    const acc={min:new Map(),max:new Map()};
    subs.forEach((sub,i)=>{
      if(i>0){
        let shift=0;
        sub.c.min.forEach((v,r)=>{ if(acc.max.has(r)) shift=Math.max(shift, acc.max.get(r)+SEP-v); });
        if(shift) shiftSub(sub, shift);
      }
      mergeInto(acc, sub.c);
    });
    return acc;
  }
  function layoutSubtree(id){                        // → {nodes, c:{min,max}}
    placed.add(id);
    const r=idLayer.get(id);
    const kids=(bbKids.get(id)||[]).filter(k=>!isDummy(k)&&!placed.has(k));
    if(!kids.length){
      x.set(id,0);
      return {nodes:[id], c:{min:new Map([[r,0]]), max:new Map([[r,0]])}};
    }
    const subs=kids.map(layoutSubtree);
    packSiblings(subs);
    const cxs=kids.map(k=>x.get(k));
    x.set(id, (Math.min(...cxs)+Math.max(...cxs))/2);  // centre over children
    const nodes=[id].concat(...subs.map(s=>s.nodes));
    const c={min:new Map(),max:new Map()};
    subs.forEach(s=>mergeInto(c,s.c));
    c.min.set(r, c.min.has(r)?Math.min(c.min.get(r),x.get(id)):x.get(id));
    c.max.set(r, c.max.has(r)?Math.max(c.max.get(r),x.get(id)):x.get(id));
    return {nodes, c};
  }
  // lay out every root subtree, then pack the roots together too
  const rootSubs=roots.map(rid=>placed.has(rid)?null:layoutSubtree(rid)).filter(Boolean);
  realIds.forEach(id=>{ if(!placed.has(id)) rootSubs.push(layoutSubtree(id)); }); // stragglers
  packSiblings(rootSubs);

  // Dummy waypoints: interpolate x along their original edge by rank fraction.
  const pos=new Map();
  layers.flat().forEach(id=>{
    if(!isDummy(id)) return;
    const o=dummyOrig.get(id);
    const xs=o&&x.get(o.source), xt=o&&x.get(o.target);
    if(xs==null||xt==null){ x.set(id, xs??xt??0); return; }
    const rs=idLayer.get(o.source)??0, rt=idLayer.get(o.target)??0, rd=idLayer.get(id);
    const f=(rt===rs)?0.5:(rd-rs)/(rt-rs);
    x.set(id, xs+(xt-xs)*f);
  });

  // Safety de-overlap among real cards per layer (tidy-tree already separates
  // them, but guards against float drift / degenerate structures).
  layers.forEach(layer=>{
    const reals=layer.filter(id=>!isDummy(id)).sort((a,b)=>x.get(a)-x.get(b));
    for(let i=1;i<reals.length;i++){
      const minX=x.get(reals[i-1])+SEP;
      if(x.get(reals[i])<minX) x.set(reals[i],minX);
    }
  });

  // normalise to ≥0 and build position records. Y is driven purely by
  // dependency rank (one row per tier), so a node's position is stable as its
  // status changes — only a change in the relationships moves it.
  let minX=Infinity;
  x.forEach(v=>{ if(v<minX) minX=v; });
  const rowY=ri=> ri*(NH+VGAP);

  let maxRight=0;
  layers.forEach((layer,ri)=>{
    const py=rowY(ri);
    layer.forEach(id=>{
      const px=x.get(id)-minX;
      pos.set(id,{x:px,y:py,cx:px+NW/2,cy:py+NH/2,bx:px+NW/2,by:py+NH,tx:px+NW/2,ty:py});
      if(!isDummy(id) && px+NW>maxRight) maxRight=px+NW;   // dummies carry no card width
    });
  });
  const PAD=48;
  const H=rowY(layers.length-1)+NH+PAD*2;
  const W=maxRight+PAD*2;
  pos.forEach(p=>{ p.x+=PAD; p.cx+=PAD; p.bx+=PAD; p.tx+=PAD; p.y+=PAD; p.cy+=PAD; p.by+=PAD; p.ty+=PAD; });

  return {pos,W,H};
}

// 5c. Backbone = spanning forest: each node keeps its closest-above prerequisite
// (largest pred rank) as its primary edge; all other block edges are secondary.
// Drives both styling (solid spine vs faded extras) and vertical alignment, so
// the result reads like a tech tree. Returns a Set of "source|target" keys.
function computeBackbone(nodes, links, rank) {
  const byTgt=new Map();
  links.filter(l=>l.type==='blocks').forEach(l=>{
    if((rank.get(l.source)??0) >= (rank.get(l.target)??0)) return;   // must point down
    if(!byTgt.has(l.target)) byTgt.set(l.target,[]);
    byTgt.get(l.target).push(l.source);
  });
  const bb=new Set();
  byTgt.forEach((ps,tgt)=>{
    let best=ps[0];
    ps.forEach(p=>{ if((rank.get(p)??0)>(rank.get(best)??0)) best=p; });
    bb.add(best+'|'+tgt);
  });
  return bb;
}

// 6. Reconstruct chains through dummies → list of {id, from, to, wps:[positions]}
// A real source may block several targets (fan-out), so the dummy spine for
// each original edge is keyed by the dummy node (which has one successor),
// while real sources branch. We start one walk per block-link out of a real
// source and follow single-successor dummies to the real target.
function buildChains(augLinks, pos) {
  const blockLinks=augLinks.filter(l=>l.type==='blocks');
  // dummy → its single successor (dummy spine)
  const dummyNext=new Map();
  blockLinks.forEach(l=>{ if(isDummy(l.source)) dummyNext.set(l.source,l.target); });

  const chains=[], emitted=new Set();
  blockLinks.forEach(l=>{
    if (isDummy(l.source)) return;           // spine segments handled via walk
    const visited=[l.source];
    let cur=l.target;
    visited.push(cur);
    while (isDummy(cur) && dummyNext.has(cur)) {
      cur=dummyNext.get(cur);
      if (visited.includes(cur)) break;      // cycle guard
      visited.push(cur);
    }
    if (isDummy(cur)) return;                 // spine didn't reach a real node
    const key=`${l.source}->${cur}`;
    if (emitted.has(key)) return; emitted.add(key);
    const wps=visited.map(id=>pos.get(id)).filter(Boolean);
    if (wps.length>=2) chains.push({id:key,from:l.source,to:cur,wps});
  });
  return chains;
}

// 7. Global router — assign distinct exit/entry ports per node and distinct
// horizontal lanes per inter-layer gap, so parallel runs don't overlap.
//
// Each chain is {from, to, wps:[positions]}. We mutate each chain to carry
// `pts` (the orthogonal point list) and `gap` info for highlighting.
function routeChains(chains, pos) {
  // ── Ports: spread edge endpoints across each node's bottom/top edge ──
  // Group chains by real source (for exit ports) and real target (entry ports).
  const PORT_INSET = 14;          // keep ports off the rounded corners
  const usable = NW - PORT_INSET*2;

  const bySource = new Map();     // sourceId -> [chains]
  const byTarget = new Map();
  chains.forEach(c => {
    if (!bySource.has(c.from)) bySource.set(c.from, []);
    if (!byTarget.has(c.to)) byTarget.set(c.to, []);
    bySource.get(c.from).push(c);
    byTarget.get(c.to).push(c);
  });

  // Exit ports: order by the x of the chain's next waypoint (where it heads).
  bySource.forEach(cs => {
    cs.sort((a,b)=>(a.wps[1]?.cx ?? a.wps[1]?.x ?? 0)-(b.wps[1]?.cx ?? b.wps[1]?.x ?? 0));
    const p = pos.get(cs[0].from);
    cs.forEach((c,j)=>{
      const t = cs.length===1 ? 0.5 : (j+1)/(cs.length+1);
      c.exitX = p.x + PORT_INSET + usable*t;
    });
  });
  // Entry ports: order by the x of the chain's penultimate waypoint.
  byTarget.forEach(ct => {
    ct.sort((a,b)=>{
      const aw=a.wps[a.wps.length-2], bw=b.wps[b.wps.length-2];
      return (aw?.cx ?? aw?.x ?? 0)-(bw?.cx ?? bw?.x ?? 0);
    });
    const p = pos.get(ct[0].to);
    ct.forEach((c,j)=>{
      const t = ct.length===1 ? 0.5 : (j+1)/(ct.length+1);
      c.entryX = p.x + PORT_INSET + usable*t;
    });
  });

  // ── Lanes: give every horizontal segment crossing a gap its OWN lane, spread
  // across the gap's height (so parallel runs stay visually separated), but
  // ORDER the lanes top↔bottom to avoid crossings — both within one node's
  // fan-out and between different sources. Two segments cross when one's
  // vertical down-tap (endX) or up-tap (startX) pierces the other's horizontal
  // span; orderCross counts that for a given top→bottom order, and bestOrder
  // searches for the order with the fewest such crossings.
  const gapSegs = new Map();   // gapKey -> [seg]
  chains.forEach(c => {
    for (let i=0;i<c.wps.length-1;i++) {
      const gapKey = c.wps[i].by.toFixed(1);
      const sx = i===0 ? c.exitX : c.wps[i].cx;                 // up-tap x (from above)
      const ex = i===c.wps.length-2 ? c.entryX : c.wps[i+1].cx; // down-tap x (to below)
      const seg = {chain:c, segIndex:i, top:c.wps[i].by, bot:c.wps[i+1].ty,
                   sx, ex, lo:Math.min(sx,ex), hi:Math.max(sx,ex)};
      if (!gapSegs.has(gapKey)) gapSegs.set(gapKey, []);
      gapSegs.get(gapKey).push(seg);
    }
  });
  // does putting A directly above B cause a crossing? A's down-tap (ex) plunging
  // to the bottom can pierce B's span; B's up-tap (sx) rising to the top can
  // pierce A's span. (Endpoints that merely touch a span don't count.)
  function pairCross(A, B){
    return (A.ex>B.lo+0.5 && A.ex<B.hi-0.5 ? 1 : 0)
         + (B.sx>A.lo+0.5 && B.sx<A.hi-0.5 ? 1 : 0);
  }
  function orderCross(order){
    let c=0;
    for(let a=0;a<order.length;a++) for(let b=a+1;b<order.length;b++) c+=pairCross(order[a], order[b]);
    return c;
  }
  function permOrder(arr){ if(arr.length<=1) return [arr]; const r=[];
    arr.forEach((v,i)=>{ const rest=arr.slice(0,i).concat(arr.slice(i+1)); permOrder(rest).forEach(p=>r.push([v,...p])); }); return r; }
  function bestOrder(segs){
    // seed: for each pair, prefer the relative order that avoids a crossing;
    // ties fall back to left-to-right. (A fan-out lands in nesting order.)
    const seed=[...segs].sort((A,B)=> (pairCross(A,B)-pairCross(B,A)) || (A.lo-B.lo) || (A.hi-B.hi));
    if(segs.length<=6){                              // small gaps: brute-force optimal
      let best=seed, bc=orderCross(seed);
      permOrder(segs).forEach(o=>{ const c=orderCross(o); if(c<bc){bc=c; best=o;} });
      return best;
    }
    let order=seed, improved=true, guard=0;          // larger gaps: transpose-refine
    while(improved && guard++<20){
      improved=false;
      for(let i=0;i<order.length-1;i++){
        const before=orderCross(order);
        [order[i],order[i+1]]=[order[i+1],order[i]];
        if(orderCross(order)<before) improved=true;
        else [order[i],order[i+1]]=[order[i+1],order[i]];
      }
    }
    return order;
  }

  const laneY = new Map();        // chain+seg -> y of its own horizontal lane
  gapSegs.forEach(segs=>{
    const order=bestOrder(segs);
    const n=order.length;
    order.forEach((seg,idx)=>{
      const span=seg.bot-seg.top;
      const t = n===1 ? 0.5 : 0.15 + 0.7*(idx/(n-1));
      laneY.set(seg.chain.id+':'+seg.segIndex, seg.top + span*t);
    });
  });

  // ── Build the point list for each chain using ports + lanes ──
  chains.forEach(c => {
    const wps=c.wps, pts=[];
    for (let i=0;i<wps.length-1;i++) {
      const p=wps[i], q=wps[i+1];
      const startX = i===0 ? c.exitX : p.cx;
      const endX   = i===wps.length-2 ? c.entryX : q.cx;
      const runY = laneY.get(c.id+':'+i) ?? (p.by+q.ty)/2;
      if (i===0) pts.push({x:startX, y:p.by});       // exit bottom of source
      pts.push({x:startX, y:runY});                  // down to this gap's lane
      pts.push({x:endX, y:runY});                    // horizontal across lane
      if (i===wps.length-2) pts.push({x:endX, y:q.ty}); // enter top of target
    }
    c.pts = pts;
  });
  return chains;
}

// Deduplicate consecutive identical points
function dedupPts(pts) {
  return pts.filter((p,i)=>i===0||Math.abs(p.x-pts[i-1].x)>0.01||Math.abs(p.y-pts[i-1].y)>0.01);
}

// Build SVG path string with rounded corners (quadratic bezier at bends)
function orthoPath(pts, r) {
  pts=dedupPts(pts);
  if (pts.length<2) return '';
  let d=`M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for (let i=1;i<pts.length;i++) {
    const prev=pts[i-1], cur=pts[i], next=pts[i+1];
    if (!next) { d+=` L ${cur.x.toFixed(1)} ${cur.y.toFixed(1)}`; continue; }
    const dx1=cur.x-prev.x, dy1=cur.y-prev.y;
    const dx2=next.x-cur.x, dy2=next.y-cur.y;
    const len1=Math.sqrt(dx1*dx1+dy1*dy1), len2=Math.sqrt(dx2*dx2+dy2*dy2);
    if (len1<0.01||len2<0.01) { d+=` L ${cur.x.toFixed(1)} ${cur.y.toFixed(1)}`; continue; }
    const ar=Math.min(r, len1/2, len2/2);
    const bx=cur.x-(dx1/len1)*ar, by=cur.y-(dy1/len1)*ar;
    const ax=cur.x+(dx2/len2)*ar, ay=cur.y+(dy2/len2)*ar;
    d+=` L ${bx.toFixed(1)} ${by.toFixed(1)} Q ${cur.x.toFixed(1)} ${cur.y.toFixed(1)} ${ax.toFixed(1)} ${ay.toFixed(1)}`;
  }
  return d;
}

// Lay a string into (up to) two tspan lines inside `sel`, wrapping on word
// boundaries to fit `maxW` px. If words remain after the second line, the
// second line is ellipsized. Measures with getComputedTextLength (the element
// is already attached to the live SVG, so the measurement is real).
function wrapTitleTwoLines(sel, str, x, [y1,y2], maxW) {
  const words=(str||'').trim().split(/\s+/).filter(Boolean);
  const l1=sel.append('tspan').attr('x',x).attr('y',y1).node();
  const l2=sel.append('tspan').attr('x',x).attr('y',y2).node();
  const fits=(node,s)=>{ node.textContent=s; return node.getComputedTextLength()<=maxW; };
  let i=0, s1='';
  while(i<words.length){                       // greedily fill line 1
    const cand=s1?s1+' '+words[i]:words[i];
    if(!fits(l1,cand) && s1) break;            // always keep ≥1 word per line
    s1=cand; i++;
  }
  l1.textContent=s1;
  let s2='';
  while(i<words.length){                        // greedily fill line 2
    const cand=s2?s2+' '+words[i]:words[i];
    if(!fits(l2,cand) && s2) break;
    s2=cand; i++;
  }
  if(i<words.length){                           // leftover → ellipsize line 2
    let t=s2;
    while(t && !fits(l2,t+'…')) t=t.slice(0,-1);
    l2.textContent=(t||s2)+'…';
  } else {
    l2.textContent=s2;
  }
}

// Assignee helpers: a display name, initials for the on-card disc, and a
// stable per-person colour so the same person reads the same everywhere.
function assigneeName(n){ return n.assignee && (n.assignee.displayName||n.assignee.name) || ''; }
function initials(name){
  const parts=(name||'').trim().split(/\s+/).filter(Boolean);
  if(!parts.length) return '?';
  if(parts.length===1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0]+parts[parts.length-1][0]).toUpperCase();
}
function personColor(name){
  let h=0; for(let i=0;i<(name||'').length;i++) h=(h*31+name.charCodeAt(i))>>>0;
  return `hsl(${h%360}, 52%, 52%)`;
}

// ── Render ───────────────────────────────────────────────────────────────────
function render(nodes, links, filterText='') {
  const wrap=document.getElementById('gw');
  const svgEl=document.getElementById('svg');
  const emptyEl=document.getElementById('es');
  const tooltip=document.getElementById('tt');
  svgEl.innerHTML='';

  const ft=filterText.toLowerCase().trim();
  let visNodes=nodes, visLinks=links;
  if (ft) {
    const mids=new Set(nodes.filter(n=>
      n.identifier?.toLowerCase().includes(ft)||n.title?.toLowerCase().includes(ft)
    ).map(n=>n.id));
    links.forEach(l=>{ if(mids.has(l.source)) mids.add(l.target); if(mids.has(l.target)) mids.add(l.source); });
    visNodes=nodes.filter(n=>mids.has(n.id));
    const vs=new Set(visNodes.map(n=>n.id));
    visLinks=links.filter(l=>vs.has(l.source)&&vs.has(l.target));
  }

  if (!visNodes.length) {
    svgEl.style.display='none'; emptyEl.style.display='flex';
    emptyEl.querySelector('span:last-child').textContent=ft?'No issues match.':'No issues loaded.';
    return;
  }
  svgEl.style.display='block'; emptyEl.style.display='none';

  // Pipeline — rank purely by dependency depth (no status banding), so nodes
  // keep their position as their status changes; only relationship changes move them.
  const wW=wrap.clientWidth, wH=wrap.clientHeight;
  let rank=assignLayers(visNodes, visLinks);
  rank=compactLayers(visNodes, visLinks, rank);
  const backbone=computeBackbone(visNodes, visLinks, rank);
  const {augNodes,augLinks}=insertDummies(visNodes, visLinks, rank, backbone);
  let layers=buildLayers(augNodes, rank);
  layers=minimizeCrossings(layers, augLinks);
  const {pos,W,H}=assignCoords(layers, augLinks);

  // SVG — natural tech-tree columns at full card size; pan both axes (#gw
  // scrolls). No wrapping, no zoom: a wide tree scrolls horizontally like a game
  // skill tree. Centre only when the tree is narrower than the viewport.
  const svgW=Math.max(W,wW);
  const offX=W<wW ? (wW-W)/2 : 0;
  svgSel=d3.select(svgEl).attr('width',svgW).attr('height',H).attr('viewBox',null);

  const defs=svgSel.append('defs');
  // ab = backbone arrowhead, abf = faded secondary arrowhead, ar = related
  [['ab','#E24B4A',8,0.85],['abf','#E24B4A',8,0.4],['ar','#888780',6,0.5]].forEach(([id,col,rx,op])=>{
    defs.append('marker').attr('id',id).attr('viewBox','0 0 10 10')
      .attr('refX',rx).attr('refY',5).attr('markerWidth',5).attr('markerHeight',5)
      .attr('orient','auto-start-reverse')
      .append('path').attr('d','M2 1L8 5L2 9').attr('fill','none')
      .attr('stroke',col).attr('stroke-width',1.5).attr('stroke-opacity',op)
      .attr('stroke-linecap','round').attr('stroke-linejoin','round');
  });

  gSel=svgSel.append('g').attr('transform',`translate(${offX},0)`);

  // Related edges — simple curved arcs, behind everything
  const relEdges=gSel.append('g').attr('class','rel-edges');
  visLinks.filter(l=>l.type==='related').forEach(l=>{
    const ps=pos.get(l.source), pt=pos.get(l.target); if(!ps||!pt) return;
    // Arc from right side of source to right side of target, curves outward
    const x1=ps.x+NW, y1=ps.cy, x2=pt.x+NW, y2=pt.cy;
    const bulge=Math.abs(y2-y1)*0.5+40;
    const mx=Math.max(x1,x2)+bulge;
    relEdges.append('path')
      .attr('d',`M ${x1} ${y1} C ${mx} ${y1} ${mx} ${y2} ${x2} ${y2}`)
      .attr('data-src',l.source).attr('data-tgt',l.target).attr('data-related','1')
      .attr('fill','none').attr('stroke','#888780').attr('stroke-width',0.8)
      .attr('stroke-dasharray','3 2').attr('stroke-opacity',0.4)
      .attr('marker-end','url(#ar)');
  });

  // `backbone` (the solid spine: one primary prerequisite per node) was computed
  // up top and used for alignment; here it just drives edge styling. Secondary
  // edges (faded) are the extra prerequisites / long links / backward edges.
  const BB_OP=0.85, SEC_OP=0.22;   // default opacities for backbone / secondary

  // Blocks edges — orthogonal, with distributed ports + lanes
  const blockEdges=gSel.append('g').attr('class','block-edges');
  const chains=routeChains(buildChains(augLinks, pos), pos);
  // draw secondary first so the backbone spine sits on top
  chains.sort((a,b)=>(backbone.has(a.from+'|'+a.to)?1:0)-(backbone.has(b.from+'|'+b.to)?1:0));
  chains.forEach(c=>{
    const bb=backbone.has(c.from+'|'+c.to);
    blockEdges.append('path')
      .attr('d',orthoPath(c.pts,R))
      .attr('data-src',c.from).attr('data-tgt',c.to).attr('data-bb',bb?'1':'0')
      .attr('fill','none').attr('stroke','#E24B4A')
      .attr('stroke-width',bb?1.6:0.9)
      .attr('stroke-opacity',bb?BB_OP:SEC_OP)
      .attr('marker-end',bb?'url(#ab)':'url(#abf)');
  });

  // Adjacency over block links (for transitive upstream/downstream highlight)
  const fwd=new Map(), rev=new Map();   // fwd: blocks → ; rev: blocked-by ←
  visNodes.forEach(n=>{ fwd.set(n.id,[]); rev.set(n.id,[]); });
  visLinks.filter(l=>l.type==='blocks').forEach(l=>{
    if(fwd.has(l.source)) fwd.get(l.source).push(l.target);
    if(rev.has(l.target)) rev.get(l.target).push(l.source);
  });
  function reach(start, adj) {           // transitive closure incl. start
    const seen=new Set([start]), stack=[start];
    while(stack.length){ const cur=stack.pop();
      (adj.get(cur)||[]).forEach(nx=>{ if(!seen.has(nx)){seen.add(nx); stack.push(nx);} });
    }
    return seen;
  }
  function highlight(nodeId){
    // chain = node + everything upstream + everything downstream
    const set=new Set([...reach(nodeId,fwd),...reach(nodeId,rev)]);
    nodeG.selectAll('g[data-node]').attr('opacity',function(){
      return set.has(this.getAttribute('data-node'))?1:0.12;
    });
    blockEdges.selectAll('path').attr('stroke-opacity',function(){
      const s=this.getAttribute('data-src'), t=this.getAttribute('data-tgt');
      return set.has(s)&&set.has(t)?0.95:0.06;
    });
    relEdges.selectAll('path').attr('stroke-opacity',0.06);
  }
  function clearHighlight(){
    nodeG.selectAll('g[data-node]').attr('opacity',1);
    blockEdges.selectAll('path').attr('stroke-opacity',function(){
      return this.getAttribute('data-bb')==='1'?BB_OP:SEC_OP;
    });
    relEdges.selectAll('path').attr('stroke-opacity',0.4);
  }

  // Readiness (orthogonal to status): is each issue blocked, unblocked, or only
  // blocked by In-Review work (startable as a stacked PR)? Computed over the FULL
  // graph (not the filtered view) so a hidden blocker can't make a node look ready.
  const allById=new Map(nodes.map(n=>[n.id,n]));
  const blockersOf=new Map(nodes.map(n=>[n.id,[]]));
  links.filter(l=>l.type==='blocks').forEach(l=>{ if(blockersOf.has(l.target)) blockersOf.get(l.target).push(l.source); });
  function readinessOf(n){
    if(isDone(n.stateType)||isCancelled(n.stateType)) return 'none';   // finished — no mark
    const open=(blockersOf.get(n.id)||[]).map(id=>allById.get(id)).filter(Boolean)
      .filter(b=>!isDone(b.stateType)&&!isCancelled(b.stateType));     // still-pending blockers
    if(!open.length) return 'unblocked';
    if(open.every(b=>isReview(b.stateType,b.stateName))) return 'review';  // stackable PRs
    return 'blocked';
  }

  // Nodes
  const nodeG=gSel.append('g').attr('class','nodes');
  visNodes.forEach(n=>{
    const p=pos.get(n.id); if(!p) return;
    const col=stateColor(n.stateType, n.stateName), ext=n.external;
    const rd = ext ? 'ext' : readinessOf(n);
    const g=nodeG.append('g').attr('data-node',n.id).attr('transform',`translate(${p.x},${p.y})`).style('cursor','pointer')
      .on('mouseover', ()=>{
        highlight(n.id);
        const bMe=visLinks.filter(l=>l.target===n.id&&l.type==='blocks')
          .map(l=>visNodes.find(x=>x.id===l.source)?.identifier||l.source);
        const iBlk=visLinks.filter(l=>l.source===n.id&&l.type==='blocks')
          .map(l=>visNodes.find(x=>x.id===l.target)?.identifier||l.target);
        let h=`<strong>${n.identifier}</strong><br>${n.title}`;
        if (n.stateName) h+=`<br><span style="opacity:0.6">${n.stateName}</span>`;
        const who=assigneeName(n);
        if (who) h+=`<br><span style="opacity:0.6">${who}</span>`;
        const rdLabel={unblocked:'Unblocked — ready to start',review:'Startable — blockers in review',blocked:'Blocked'}[rd];
        if (rdLabel) h+=`<br><span style="opacity:0.7">${rdLabel}</span>`;
        if (bMe.length) h+=`<br><span style="color:var(--c-block)">Blocked by: ${bMe.join(', ')}</span>`;
        if (iBlk.length) h+=`<br><span style="color:var(--c-block)">Blocks: ${iBlk.join(', ')}</span>`;
        if (ext) h+=`<br><span style="opacity:0.45"><em>External</em></span>`;
        tooltip.innerHTML=h; tooltip.style.display='block';
      })
      .on('mousemove', e=>{
        const rect=wrap.getBoundingClientRect();
        // #gw scrolls, so add scroll offsets to map viewport → content coords
        let x=e.clientX-rect.left+wrap.scrollLeft+12, y=e.clientY-rect.top+wrap.scrollTop-8;
        if(e.clientX-rect.left+252>wrap.clientWidth) x-=264;
        tooltip.style.left=x+'px'; tooltip.style.top=y+'px';
      })
      .on('mouseout',()=>{ tooltip.style.display='none'; clearHighlight(); })
      .on('click',()=>window.open(`https://linear.app/${WORKSPACE}/issue/${n.identifier}`,'_blank'));

    // Card background. The border STYLE encodes readiness (orthogonal to the
    // status colour): dashed = only blocked by review work (stackable), faint =
    // blocked, plain solid = unblocked / done / cancelled. The left accent bar
    // tracks the same opacity so it dims with the border. External stays faint.
    const bs = {
      unblocked:{w:1,   o:0.8,  d:null },
      review:   {w:1.5, o:0.95, d:'4 3'},
      blocked:  {w:1,   o:0.28, d:null },
      none:     {w:1,   o:0.8,  d:null },
      ext:      {w:0.5, o:0.4,  d:null },
    }[rd];
    g.append('rect').attr('width',NW).attr('height',NH).attr('rx',6)
      .attr('fill',col).attr('fill-opacity',ext?0.07:0.10)
      .attr('stroke',col).attr('stroke-width',bs.w).attr('stroke-opacity',bs.o)
      .attr('stroke-dasharray',bs.d);

    // Left accent bar — opacity matches the border (readiness-driven).
    g.append('rect').attr('x',0).attr('y',5).attr('width',3).attr('height',NH-10).attr('rx',1.5)
      .attr('fill',col).attr('fill-opacity',bs.o);

    // Identifier label
    g.append('text').attr('x',11).attr('y',16)
      .attr('font-size',10).attr('font-weight',600).attr('font-family','var(--font)')
      .attr('fill',col).attr('fill-opacity',ext?0.55:1)
      .text(n.identifier);

    // Assignee — initials disc in the top-right corner (sits in the identifier
    // row, above the title lines). Title width is reserved so it never collides.
    const who=assigneeName(n);
    if (who) {
      const cx=NW-13, cy=11, r=7.5;
      g.append('circle').attr('cx',cx).attr('cy',cy).attr('r',r)
        .attr('fill',personColor(who)).attr('fill-opacity',ext?0.4:0.95)
        .attr('stroke',col).attr('stroke-opacity',ext?0.2:0.35).attr('stroke-width',0.5);
      g.append('text').attr('x',cx).attr('y',cy+2.8).attr('text-anchor','middle')
        .attr('font-size',7.5).attr('font-weight',700).attr('font-family','var(--font)')
        .attr('fill','#fff').attr('fill-opacity',ext?0.7:1).style('pointer-events','none')
        .text(initials(who));
    }

    // Title — wrapped to two lines (fixed card size). Sits below the identifier
    // row, so it clears the assignee disc without needing a width reservation.
    const titleEl=g.append('text')
      .attr('font-size',11).attr('font-family','var(--font)')
      .attr('fill','var(--text)').attr('fill-opacity',ext?0.4:0.85);
    wrapTitleTwoLines(titleEl, n.title, 11, [28,39], NW-19);
  });

  // Graph is sized to fit width and centred (gSel transform set above); the
  // page scrolls vertically. Reset scroll to the top on each render.
  wrap.scrollTop=0;
}

// Scroll the view to the top (where Done / earliest work sits).
function scrollToTop() {
  const wrap=document.getElementById('gw');
  wrap.scrollTo({top:0, behavior:'smooth'});
}

// ── Controls ─────────────────────────────────────────────────────────────────
document.getElementById('lb').addEventListener('click', async ()=>{
  const pid=document.getElementById('pi').value.trim().toUpperCase();
  if (!pid)  { setStatus('Enter a parent issue identifier.',true); return; }
  const btn=document.getElementById('lb');
  btn.disabled=true; btn.textContent='Loading…';
  setStatus('Fetching from Linear…');
  try {
    const issues=await loadIssues(pid);
    const {nodes,links}=buildGraph(issues);
    allNodes=nodes; allLinks=links;
    document.getElementById('legend').style.display='flex';
    const nb=links.filter(l=>l.type==='blocks').length;
    setStatus(`${issues.length} issues · ${nb} blocking relation${nb!==1?'s':''} · click to open in Linear`);
    render(allNodes,allLinks,document.getElementById('fi').value);
    // Reflect the loaded root in the URL so a refresh keeps it (no history spam).
    const url=new URL(location.href); url.searchParams.set('issue',pid);
    history.replaceState(null,'',url);
  } catch(e) { setStatus('Error: '+e.message,true); console.error(e); }
  finally { btn.disabled=false; btn.textContent='Reload'; }
});
document.getElementById('fi').addEventListener('input', e=>{ if(allNodes.length) render(allNodes,allLinks,e.target.value); });
document.getElementById('zf').addEventListener('click', scrollToTop);
document.getElementById('pi').addEventListener('keydown',e=>{
  if(e.key==='Enter') document.getElementById('lb').click();
});
window.addEventListener('resize', ()=>{ if(allNodes.length) render(allNodes,allLinks,document.getElementById('fi').value); });

// Pick up the workspace slug (for click-to-open links) from the server config.
fetch('/api/meta').then(r=>r.json()).then(m=>{ if(m.workspace) WORKSPACE=m.workspace; }).catch(()=>{});

// Restore the root issue from the URL (?issue=FIL-273) so a refresh keeps it.
const initialIssue=new URLSearchParams(location.search).get('issue');
if(initialIssue){
  document.getElementById('pi').value=initialIssue;
  document.getElementById('lb').click();
}
</script>
